# Test printer for the dry-run tests (Klipper batch mode, no hardware).
# CoreXY 300x300x250, one STM32F446 MCU: build its data dictionary with
# tests/build_dict.sh, or pass another one with --dict and adapt the pins.

[mcu]
serial: /dev/null

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 300
position_max: 300
homing_speed: 50

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 300
position_max: 300
homing_speed: 50

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0
position_min: -2
position_max: 250
homing_speed: 10

[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 22.6
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF4
control: pid
pid_Kp: 22
pid_Ki: 1
pid_Kd: 100
min_temp: 0
max_temp: 300
min_extrude_temp: 0

[safe_z_home]
home_xy_position: 150, 150
z_hop: 5

[force_move]
enable_force_move: True

[virtual_sdcard]
path: /tmp/npz_test/gcodes

[pause_resume]

[display_status]

[filament_switch_sensor runout1]
switch_pin: PG12
pause_on_runout: False

######################################################################
# Zones under test
######################################################################

[no_print_zone]

# A docking lever next to the front left frame corner: enter along X10.5
# down to Y0, press in -X down to X0, come back the same way.
[no_print_zone dock]
type: rails
x_max: 11
y_max: 22
rails:
    X10.5 Y27:0
    Y0 X10.5:0
speed: 10
accel: 500
z_moves: idle
suspend_runout: runout1

# Strip reserved for purge lines, behind the dock
[no_print_zone purge]
type: reserved
x_max: 15
y_min: 22
y_max: 200

# A bed clip 4 mm tall at the front right: fly over it, never through it
[no_print_zone clip]
type: keepout
x_min: 280
y_max: 20
z_max: 4

# A brush 8 mm tall at the back: wiping only when opened, slowly
[no_print_zone brush]
type: reserved
x_min: 200
x_max: 260
y_min: 285
z_max: 8
speed: 50
