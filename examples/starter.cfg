# no_print_zone - zones the toolhead must not enter (created by install.sh)
#
# The module checks EVERY toolhead move (G-code, macros, jogs from the web
# interface) before it starts, and refuses the ones that would violate a zone.
# Until a zone is defined below, it does nothing.
#
# Add zones:
#   - with the wizard, which never moves the printer: you jog the toolhead,
#     it reads the position:   ~/klipper-no-print-zone/install.sh --wizard
#   - or by hand, below. Full guide with examples and every error message:
#     ~/klipper-no-print-zone/docs/configuration.md
#     https://github.com/Longo-Al/Klipper-no-print-zone/blob/main/docs/configuration.md
#
# After a change, restart the Klipper service (the wizard does it for you).
#
# Coordinates: TOOLHEAD position, the "toolhead:" line of GET_POSITION (not
# M114). Measure with the printer homed, then add a margin of 1-2 mm.
# A zone is a box; a bound you leave out reaches the end of travel. Its faces
# are outside: with x_max: 11, X 11 is allowed. The whole move is checked, so
# a diagonal cutting a corner of a zone is refused.


[no_print_zone]
# Global options, all optional.
#state_file: ~/printer_data/config/no_print_zone.json
#   Remembers which zones hold the toolhead (homing lock), across restarts.
#tested_klipper_version:
#   After running ~/klipper-no-print-zone/install.sh --test, write here your
#   Klipper version (as shown by the web interface): when Klipper is updated
#   you get a warning to test again.
#tolerance: 0.01
#   mm: how close to a rail a move must start.
#block_force_move: True
#   Refuse FORCE_MOVE on the X/Y/Z steppers (it bypasses every check).
#unknown_z: ignore
#   Zones with a Z bound, while Z is not homed: ignore | full_height.
#print_moves: reroute
#   During a print, a move into a closed zone goes around it (reroute) or
#   stops the print (stop).
#reroute_extrude: first
#   Going around a zone, extrude along its faces once per layer (first) or
#   never.
#reroute_margin: 0
#   mm between the path around a zone and its faces (with skew_correction).


# ---------------------------------------------------------------------------
# One section per zone:  [no_print_zone NAME]   NAME: lower case, digits, _
#
#type:
#   keepout   never entered (bed clips, sensors, frame parts).
#   reserved  entered only between NPZ_OPEN ZONE=NAME and NPZ_CLOSE, i.e.
#             from your macros (purge bucket, brush, purge strip).
#   rails     entered only along declared straight paths (docks, a cutter
#             lever pushed against the frame).
#   A move that starts inside a keepout/reserved zone may always leave it.
#x_min:
#x_max:
#y_min:
#y_max:
#z_min:
#z_max:
#   Bounds in mm. At least one. A missing one is unbounded. With z_max the
#   toolhead may fly over the obstacle but not come down into it.
#speed:
#accel:
#   Limits (mm/s, mm/s^2) on every allowed move touching the zone.
#   Default 10 and 500 for rails zones, no limit otherwise.
#lock_homing:
#   True: once the toolhead has entered, G28 is refused until it is out and
#   NPZ_CLOSE (or NPZ_CLEAR) runs. Default True for rails zones only.
#suspend_runout:
#   filament_switch_sensor names (comma separated) disabled while the zone is
#   open or holds the toolhead: a PAUSE there could park along a forbidden path.
#
# rails zones only:
#rails:
#   One rail per line: "X10.5 Y27:0" = at X 10.5, from Y 27 (outer end) to
#   Y 0 (inner end). From outer to inner (inward) needs NPZ_OPEN; back
#   (outward) is always allowed. Rails run along X or Y, Z must not change.
#z_moves: deny
#   Moves of Z alone inside the zone: deny | idle (no print running, Z
#   homed) | allow.
#z_tolerance: 0
#   mm of Z change accepted on a rail move (only with a bed mesh over it).
#
# Commands: NPZ_STATUS, NPZ_OPEN ZONE=a,b, NPZ_CLOSE [ZONE=a,b],
#           NPZ_PREP ENABLE=1|0 (in START_PRINT), NPZ_CLEAR [CONFIRM=1]
# ---------------------------------------------------------------------------


# Examples. Measure YOUR printer before removing the # signs.

# A purge bucket with a brush at the back, 12 mm tall: the toolhead flies
# over it, and comes down into it only from your wipe macro.
#[no_print_zone bucket]
#type: reserved
#x_min: 228
#x_max: 302
#y_min: 285
#z_max: 14

# Bed clips 3 mm tall at the front: never through them.
#[no_print_zone clips]
#type: keepout
#y_max: 12
#z_max: 4

# A dock reached from the front along X 150 down to Y 5.
#[no_print_zone dock]
#type: rails
#x_min: 130
#x_max: 170
#y_max: 20
#rails:
#    X150 Y30:5
#lock_homing: True
#z_moves: deny
