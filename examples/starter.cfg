# no_print_zone - zones the toolhead must not enter (created by install.sh)
#
# Add zones with the wizard:   ~/klipper-no-print-zone/install.sh --wizard
# or by hand: examples in ~/klipper-no-print-zone/examples/, every option in
# ~/klipper-no-print-zone/README.md
#
# After a change, restart the Klipper SERVICE (the wizard does it for you):
# the RESTART command does not reload the module.
#
# Until a zone is defined below, the module does nothing.

[no_print_zone]
#tested_klipper_version:
#   After running ~/klipper-no-print-zone/install.sh --test, write here your
#   Klipper version (as shown by the web interface): when Klipper is updated
#   you get a warning to test again.

# Example, measure YOUR printer before removing the # signs:
#[no_print_zone purge]
#type: reserved
#x_max: 15
#y_min: 22
#y_max: 300
