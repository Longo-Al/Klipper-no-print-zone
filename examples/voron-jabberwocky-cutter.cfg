# no_print_zone - Voron 2.4 350 with a LDO JabberWocky toolhead (Nitehawk-36)
#
# The JabberWocky filament cutter is a lever (Filametrix style) on the left
# side of the toolhead, pressed against the front left frame corner (the Z0
# column). A fast straight move from the back toward the front breaks the
# toolhead and the cutter. Measured on the machine (toolhead coordinates):
#   - the lever touches the column below X 10.5 and Y 22 (10.5 measured + 0.5
#     for the repeatability of the sensorless X homing -> boundary X 11);
#   - the cut: go down along X 10.5 to Y 0 next to the column, press in -X to
#     X 0, retract the filament 2 mm with the lever pressed (it unlocks the
#     blade), release in +X, go back up in +Y;
#   - Z may move with the toolhead next to the column, but only outside a
#     print and with Z homed;
#   - purge lines go in the strip behind the column, X < 15 and Y 22..340.
#
# Module: no_print_zone.py linked into ~/klipper/klippy/extras/ (install.sh).
# Dry tests: tests/run_tests.py (see README.md). After changing the .py file
# restart the service (sudo systemctl restart klipper): RESTART is not enough.

[no_print_zone]
state_file: ~/printer_data/config/temps/no_print_zone.json
# warning in Mainsail when Klipper is updated: run the dry tests again
tested_klipper_version: v0.13.0-743-gac2a7f8b0

[no_print_zone cutter]
type: rails
x_max: 11
y_max: 22
rails:
    X10.5 Y27:0     # down next to the column (inward), back up in +Y
    Y0 X10.5:0      # lever press in -X (inward), release in +X
speed: 10           # mm/s inside the zone
accel: 500
lock_homing: True   # G28 with the lever on the column is dangerous too
z_moves: idle       # Z only outside a print and with Z homed
suspend_runout: ToolHead_FS   # a PAUSE there would park diagonally

[no_print_zone purge]
type: reserved
x_max: 15
y_min: 22
y_max: 340


[gcode_macro PURGE_LINE]
description: 300 mm purge line in the strip behind the front left column (outside a print or in START_PRINT)
variable_line_x: 5.0          # X of the line, in the strip behind the column
variable_y_start: 30.0        # starts at the front...
variable_y_end: 330.0         # ...and goes to the back, away from the column (300 mm)
variable_height: 0.4
variable_width: 0.8
variable_speed: 20            # mm/s while purging
variable_exit_x: 25.0         # X for approach and exit, right of the strip
gcode:
  {% set th = printer.toolhead %}
  {% if 'xyz' not in th.homed_axes %}
    { action_raise_error("PURGE_LINE: home first (G28)") }
  {% endif %}
  {% if not printer.extruder.can_extrude %}
    { action_raise_error("PURGE_LINE: nozzle too cold to extrude") }
  {% endif %}
  {% set fil_r = printer.configfile.settings.extruder.filament_diameter / 2 %}
  {% set e_len = (y_end - y_start) * width * height / (3.14159 * fil_r * fil_r) %}
  NPZ_OPEN ZONE=purge
  SAVE_GCODE_STATE NAME=_purge_line
  G90
  M83
  G1 Z{[th.position.z, 5]|max} F900
  # approach in Y right of the strip (away from the column), then sideways
  G1 X{exit_x} Y{y_start} F6000
  G1 X{line_x} F6000
  G1 Z{height} F600
  G1 Y{y_end} E{e_len|round(2)} F{speed * 60}
  G1 Y{y_end + 5} F{speed * 60}
  G1 Z{height + 2} F600
  G1 X{exit_x} F6000
  M400
  NPZ_CLOSE
  RESTORE_GCODE_STATE NAME=_purge_line


# Cut: down the rail to Y 0, press in -X to press_x, small retract that
# unlocks the blade, release, back up. With press_x = -1 only down and up.
# The path comes from the rails of [no_print_zone cutter]: if they change,
# the macro follows.
[gcode_macro NPZ_CUT_MOVE]
description: Filament cut on the front left column (move + unlocking retract)
variable_stage_y: 25.0        # start Y, above the cutter zone (zone up to Y 22)
variable_approach_x: 25.0     # X where the toolhead moves in Y, away from the column
variable_press_x: 0.0         # X at full press (measured 2026-11-21: X 0); -1 = no press
variable_press_dwell: 200     # ms with the lever pressed
variable_unlock_retract: 2.0  # mm retracted with the lever pressed (tested 2026-11-21)
gcode:
  {% set zone = printer["no_print_zone cutter"] %}
  {% set down = zone.rails[0] %}
  {% set press = zone.rails[1] %}
  {% set f_zone = zone.speed * 60 %}
  {% if 'xy' not in printer.toolhead.homed_axes %}
    { action_raise_error("NPZ_CUT_MOVE: home first (G28)") }
  {% endif %}
  {% set do_press = press_x >= press.inner and press_x < press.outer %}
  NPZ_OPEN ZONE=cutter,purge
  SAVE_GCODE_STATE NAME=_npz_cut
  G90
  G1 X{approach_x} Y{stage_y} F6000
  G1 X{down.x} F3000
  G1 Y{down.inner} F{f_zone}
  {% if do_press %}
    G1 X{press_x} F{f_zone}
    G4 P{press_dwell}
    {% if unlock_retract > 0 %}
      # FORCE_MOVE on the extruder works with a cold nozzle (the cut is above
      # the hotend). Write 0 - x, not -x, inside braces: for Jinja a brace
      # followed by - strips whitespace and the sign disappears.
      M400
      FORCE_MOVE STEPPER=extruder DISTANCE={0 - unlock_retract} VELOCITY=5
    {% endif %}
    G1 X{press.outer} F{f_zone}
  {% else %}
    RESPOND PREFIX="warn" MSG="NPZ_CUT_MOVE: press_x not set, no press (rail only)."
  {% endif %}
  G1 Y{stage_y} F{f_zone}
  G1 X{approach_x} F3000
  M400
  NPZ_CLOSE
  RESTORE_GCODE_STATE NAME=_npz_cut


# To TRY the cut by hand: brings the toolhead to the bottom of the rail
# (X 10.5 Y 0) and leaves the zones open. Then jog -X (down to X 0), retract,
# jog +X to leave (also past 10.5) and NPZ_CLOSE.
[gcode_macro NPZ_CUT_POSITION]
description: Bring the toolhead to the bottom of the cutter rail to try the press (zones stay open)
variable_stage_y: 25.0
variable_approach_x: 25.0
gcode:
  {% set zone = printer["no_print_zone cutter"] %}
  {% set down = zone.rails[0] %}
  {% set press = zone.rails[1] %}
  {% if 'xy' not in printer.toolhead.homed_axes %}
    { action_raise_error("NPZ_CUT_POSITION: home first (G28)") }
  {% endif %}
  NPZ_OPEN ZONE=cutter,purge
  SAVE_GCODE_STATE NAME=_npz_cutpos
  G90
  G1 X{approach_x} Y{stage_y} F6000
  G1 X{down.x} F3000
  G1 Y{down.inner} F{zone.speed * 60}
  M400
  RESTORE_GCODE_STATE NAME=_npz_cutpos
  RESPOND PREFIX="warn" MSG="Toolhead at the bottom of the rail (X{down.x} Y{down.inner}), zones cutter and purge open, runout suspended. Jog -X down to X{press.inner}, retract, then jog +X to leave (also past X{down.x}) and NPZ_CLOSE."
