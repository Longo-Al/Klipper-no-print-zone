# no_print_zone - common cases. Copy what you need into your config and
# measure the bounds on YOUR machine (toolhead coordinates, as reported by
# the web interface), keeping a safety margin.

[no_print_zone]
# Where the "toolhead held by a zone" mark is saved (default: next to
# printer.cfg). It survives restarts and power cycles.
#state_file: ~/printer_data/config/no_print_zone.json
# The module hooks into Klipper internals: with this set, Mainsail/Fluidd
# show a warning when Klipper is updated, until you run the tests again.
#tested_klipper_version: v0.13.0-743-gac2a7f8b0


# Purge bucket and brush at the back, 12 mm above the bed: the toolhead
# flies over it freely, below Z 12 it gets in only after NPZ_OPEN.
[no_print_zone bucket]
type: reserved
x_min: 230
x_max: 300
y_min: 285
z_max: 12
speed: 100            # mm/s while inside


# Bed clips 3 mm tall: never through them, always over them.
[no_print_zone clip_front_left]
type: keepout
x_max: 20
y_max: 15
z_max: 3

[no_print_zone clip_front_right]
type: keepout
x_min: 280
y_max: 15
z_max: 3


# A dock (tool, cutter lever, wiper arm...) reached by a fixed path: in from
# the front along X 150 down to Y 5, then sideways in -X down to X 120.
# Inward moves need NPZ_OPEN ZONE=dock; outward moves always work.
[no_print_zone dock]
type: rails
x_min: 110
x_max: 170
y_max: 20
rails:
    X150 Y30:5
    Y5 X150:120
speed: 20
accel: 1000
lock_homing: True     # no G28 while the toolhead is docked
z_moves: deny         # deny | idle (no print running and Z homed) | allow
#suspend_runout: my_sensor


[gcode_macro WIPE_NOZZLE]
description: Wipe the nozzle on the brush
gcode:
  NPZ_OPEN ZONE=bucket
  SAVE_GCODE_STATE NAME=_wipe
  G90
  G1 Z15 F1200
  G1 X240 Y295 F12000
  G1 Z5 F1200
  G1 X290 F6000
  G1 X240 F6000
  G1 X290 F6000
  G1 Z15 F1200
  G1 Y270 F12000
  RESTORE_GCODE_STATE NAME=_wipe
  NPZ_CLOSE ZONE=bucket
